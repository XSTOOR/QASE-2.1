# Single execution host; do not scale this local-store service to replicas.
name: qase-production
services:
  app:
    image: ${QASE_IMAGE:?Set QASE_IMAGE to the reviewed release image or digest}
    init: true
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      QASE_HOST: 0.0.0.0
      PORT: '5173'
      QASE_PUBLIC_URL: https://qase.drytis.com
      QASE_AUTH_REQUIRED: 'true'
      QASE_OPEN_REGISTRATION: 'false'
      QASE_TRUST_PROXY: 'true'
      QASE_RUN_STORE: local
      QASE_EXECUTION_MODE: local
      QASE_ARTIFACT_DIR: /app/evidence
    volumes:
      - state:/app/.qase
      - evidence:/app/evidence
    expose: ['5173']
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /home/node:uid=1000,gid=1000,mode=0700
    stop_grace_period: 120s
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
      - edge_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
volumes:
  state:
  evidence:
  tls:
  edge_config:
