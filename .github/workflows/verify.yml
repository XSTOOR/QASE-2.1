name: Verify exact QASE source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Installation, browser regressions, image build and image smoke share this
    # finite CI deadline. It does not change any agent execution budget.
    timeout-minutes: 90
    env:
      QASE_IMAGE: qase:sha-${{ github.sha }}
      # Disposable CI services only; production secrets are never supplied here.
      QASE_TEST_DATABASE_URL: postgresql://qase_test:qase_test_only@127.0.0.1:15432/qase_test
      QASE_TEST_CONTROL_DATABASE_URL: postgresql://qase_test:qase_test_only@127.0.0.1:15432/qase_test
      QASE_TEST_REDIS_URL: redis://127.0.0.1:16379
      QASE_TEST_REDIS_SERVER: /usr/bin/redis-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qase_ci_admin_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision the non-bypass disposable database role and Redis restart binary
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE qase_test LOGIN PASSWORD 'qase_test_only' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE qase_test OWNER qase_test;
          SQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
      - name: Check runtime dependency security
        run: npm run audit:dependencies
      - name: Install native browser dependencies
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium firefox webkit 2>&1 | tee "$RUNNER_TEMP/qase-browser-installation.log"
      - name: Verify source and regression suite
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/qase-verification.log"
      - name: Retain verification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qase-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qase-browser-installation.log
            ${{ runner.temp }}/qase-verification.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify dashboard navigation and secure credential handoff
        run: node scripts/qualify-live-preview.mjs
      - name: Verify account access and one-use recovery without external services
        run: |
          node scripts/test-auth-browser.mjs
          node scripts/test-reset-browser.mjs
      - name: Verify quality verdict, device management and report accessibility in all engines
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            node scripts/test-ui-followup-browser.mjs --browser "$browser"
          done
      - name: Verify Founder completion and mode launchers
        run: |
          node scripts/test-founder-completion-browser.mjs
          node scripts/test-founder-progress-browser.mjs
          node scripts/test-founder-reader-browser.mjs
          node scripts/test-founder-actions-browser.mjs
          node scripts/qualify-system-ui.mjs --launch-only
      - name: Verify SQA startup, launch and evidence across all installed engines
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            node scripts/test-sqa-startup.mjs --browser "$browser" --isolated --output-dir "test-results/phase8/sqa-${browser}-startup"
            node scripts/test-sqa-launch.mjs --browser "$browser" --output-dir "test-results/phase8/sqa-${browser}-launch"
            node scripts/test-sqa-evidence.mjs --browser "$browser" --output-dir "test-results/phase8/sqa-${browser}-evidence"
          done
      - name: Retain mode browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qase-mode-browser-${{ github.sha }}
          path: |
            test-results/founder-completion/*.png
            test-results/founder-completion/*.json
            test-results/founder-completion/*.log
            test-results/system-mode-ui/result.json
            test-results/integration/phase5-recovery-browser/*.png
            test-results/integration/phase5-recovery-browser/*.json
            test-results/founder-reader/*.png
            test-results/founder-reader/*.json
            test-results/founder-actions/*.png
            test-results/founder-actions/*.json
            test-results/phase8/**/*.png
            test-results/phase8/**/result.json
            test-results/auth/*.png
            test-results/auth/result.json
            test-results/auth-reset/*.png
            test-results/auth-reset/result.json
            test-results/ui-followup/*/*.png
            test-results/ui-followup/*/result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify release content when using the delivered snapshot
        run: node scripts/verify-release.mjs
      - name: Validate production image
        run: |
          RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('public/release.json')).releaseId")
          docker build --build-arg QASE_RELEASE_ID="$RELEASE_ID" --build-arg QASE_SOURCE_REVISION="$GITHUB_SHA" --tag "$QASE_IMAGE" .
      - name: Smoke test hardened production image without live model calls
        run: npm run test:production-image -- "$QASE_IMAGE" "$GITHUB_SHA"
      - name: Export the smoke-tested image for a Docker-capable deployment host
        shell: bash
        run: |
          set -o pipefail
          docker save "$QASE_IMAGE" | gzip > "qase-image-${GITHUB_SHA}.tar.gz"
          sha256sum "qase-image-${GITHUB_SHA}.tar.gz" > "qase-image-${GITHUB_SHA}.tar.gz.sha256"
          docker image inspect "$QASE_IMAGE" --format '{{json .}}' > "qase-image-${GITHUB_SHA}.json"
      - name: Retain production image and identity
        uses: actions/upload-artifact@v4
        with:
          name: qase-production-image-${{ github.sha }}
          path: |
            qase-image-${{ github.sha }}.tar.gz
            qase-image-${{ github.sha }}.tar.gz.sha256
            qase-image-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Package reviewed source
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: qase-reviewed-source
          path: |
            qase-share.zip
            qase-share.zip.sha256
          if-no-files-found: error
