name: Project verification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: qase_ci_admin
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: qase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qase_ci_admin -d qase_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QASE_TEST_DATABASE_URL: postgresql://qase_test:local_ci_only@127.0.0.1:5432/qase_test
      QASE_TEST_CONTROL_DATABASE_URL: postgresql://qase_test:local_ci_only@127.0.0.1:5432/qase_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create a restricted integration-test role
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: 'postgresql://qase_ci_admin:local_ci_only@127.0.0.1:5432/qase_test' });
          await client.connect();
          try {
            await client.query("CREATE ROLE qase_test LOGIN PASSWORD 'local_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS");
            await client.query('GRANT CONNECT, CREATE ON DATABASE qase_test TO qase_test');
          } finally {
            await client.end();
          }
          NODE
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:browser
      - run: npm run test:dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-qualification
          path: test-results/dashboard
